<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 플레이리스트 기반 무드 다이어리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="profileView" class="profile-view">
      <div class="profile-stage">
        <header class="profile-head">
          <p class="eyebrow">MOOD DIARY</p>
          <h1>누구의 기록인가요?</h1>
          <p>프로필을 고르고 비밀번호를 입력하세요.</p>
        </header>
        <div id="profileGrid" class="profile-grid"></div>
        <button id="newProfileBtn" class="text-button" type="button">+ 새 프로필</button>
      </div>
    </section>

    <section id="authView" class="auth-view" hidden>
      <div class="auth-card">
        <button id="authBackBtn" class="plain-back" type="button">←</button>
        <div id="authAvatar" class="avatar large"></div>
        <h2 id="authName">프로필</h2>
        <form id="loginForm" class="auth-form">
          <input id="loginPassword" type="password" minlength="6" autocomplete="current-password" placeholder="비밀번호" required>
          <button type="submit">들어가기</button>
        </form>
        <p id="loginError" class="form-message"></p>
      </div>
    </section>

    <section id="signupView" class="auth-view" hidden>
      <div class="auth-card signup-card">
        <button id="signupBackBtn" class="plain-back" type="button">←</button>
        <p class="eyebrow dark">NEW PROFILE</p>
        <h2>새 프로필</h2>
        <form id="signupForm" class="auth-form">
          <label>이름<input id="signupDisplayName" maxlength="18" required></label>
          <label>아이디<input id="signupUsername" maxlength="18" pattern="[A-Za-z0-9_]+" placeholder="영문, 숫자, _" required></label>
          <label>비밀번호<input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required></label>
          <button type="submit">프로필 만들기</button>
        </form>
        <p id="signupError" class="form-message"></p>
      </div>
    </section>

    <section id="calendarView" class="calendar-page" hidden>
      <header class="calendar-header">
        <div>
          <p class="brand">MOOD DIARY</p>
          <h1 id="monthTitle"></h1>
        </div>
        <div class="header-right">
          <button id="friendsBtn" class="header-link" type="button">FRIENDS</button>
          <button id="meBtn" class="profile-chip" type="button"><span id="meAvatar" class="avatar tiny"></span><span id="meName"></span></button>
          <nav class="calendar-nav" aria-label="달력 이동">
            <button id="prevMonth" type="button" aria-label="이전 달">←</button>
            <button id="todayBtn" type="button">TODAY</button>
            <button id="nextMonth" type="button" aria-label="다음 달">→</button>
          </nav>
        </div>
      </header>

      <div class="calendar-shell">
        <div class="week-row" aria-hidden="true">
          <span class="sun">SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span class="sat">SAT</span>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>
    </section>

    <section id="diaryView" class="diary-page" hidden>
      <header class="diary-header">
        <button id="backBtn" class="back-btn" type="button">←</button>
        <div class="selected-date"><strong id="dateTitle"></strong><span id="weekdayTitle"></span></div>
        <button id="saveBtn" class="save-btn" type="button">SAVE</button>
      </header>

      <div class="diary-sheet">
        <section class="writing-area">
          <div class="writing-meta">
            <select id="moodInput">
              <option>평온</option><option>행복</option><option>설렘</option><option>피곤</option><option>우울</option>
            </select>
            <span id="savedMark"></span>
          </div>
          <input id="titleInput" class="diary-title" maxlength="40" placeholder="제목">
          <textarea id="contentInput" placeholder="오늘을 적어보세요."></textarea>
          <button id="deleteBtn" class="delete-btn" type="button">DELETE</button>
        </section>

        <aside class="music-area">
          <div class="deck">
            <div class="deck-brand">tone</div>
            <div class="record-wrap">
              <div class="record" id="record">
                <div class="record-photo" id="recordPhoto"></div>
                <div class="record-grooves"></div><div class="record-label-ring"></div><div class="record-hole"></div>
              </div>
              <div class="spindle"></div>
            </div>
            <div class="tonearm" id="arm">
              <div class="arm-base"></div>
              <div class="arm-assembly">
                <div class="arm-tube"></div>
                <div class="headshell"><div class="stylus"></div></div>
              </div>
            </div>
            <div class="deck-control-dot"></div>
          </div>
          <div class="music-form">
            <input id="youtubeInput" type="url" placeholder="YouTube link">
            <div class="music-controls"><button id="playBtn" disabled>PLAY</button><span>/</span><button id="stopBtn" disabled>STOP</button><span id="playerState" class="player-state">READY</span></div>
          </div>
          <div id="youtubePlayer" class="hidden-player"></div>
        </aside>
      </div>
    </section>

    <section id="friendsView" class="friends-page" hidden>
      <header class="friends-header">
        <button id="friendsBackBtn" class="back-btn light" type="button">←</button>
        <div><p class="brand">FRIENDS</p><h1>서로의 하루</h1></div>
        <button id="logoutBtn" class="header-link light" type="button">LOG OUT</button>
      </header>
      <div class="friends-sheet">
        <aside class="friend-list-panel">
          <form id="addFriendForm" class="friend-search">
            <input id="friendUsername" placeholder="친구 아이디">
            <button type="submit">ADD</button>
          </form>
          <p id="friendError" class="form-message"></p>
          <div id="friendList" class="friend-list"></div>
        </aside>
        <section class="conversation-panel">
          <div id="conversationEmpty" class="conversation-empty">친구를 선택하면<br>이야기를 남길 수 있어요.</div>
          <div id="conversation" hidden>
            <header class="conversation-head"><span id="friendAvatar" class="avatar"></span><div><strong id="friendName"></strong><small id="friendId"></small></div></header>
            <div id="messageList" class="message-list"></div>
            <form id="messageForm" class="message-form"><textarea id="messageInput" maxlength="500" placeholder="짧은 이야기를 남겨보세요."></textarea><button type="submit">보내기</button></form>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
