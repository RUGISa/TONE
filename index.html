<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 플레이리스트 기반 무드 다이어리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="calendarView" class="view calendar-view">
      <header class="topbar">
        <h1>mood diary</h1>
        <button id="todayBtn" class="text-btn" type="button">today</button>
      </header>

      <div class="calendar-head">
        <button id="prevMonth" class="arrow-btn" type="button" aria-label="이전 달">←</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" class="arrow-btn" type="button" aria-label="다음 달">→</button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section id="diaryView" class="view diary-view hidden">
      <header class="topbar">
        <button id="backBtn" class="text-btn" type="button">← calendar</button>
        <input id="dateInput" type="date" aria-label="기록 날짜">
      </header>

      <section class="paper">
        <div class="writing">
          <div class="meta">
            <select id="moodInput" aria-label="오늘의 기분">
              <option value="평온">평온</option>
              <option value="행복">행복</option>
              <option value="설렘">설렘</option>
              <option value="피곤">피곤</option>
              <option value="우울">우울</option>
            </select>
            <span id="savedMark"></span>
          </div>

          <input id="titleInput" class="title" type="text" maxlength="40" placeholder="제목">
          <textarea id="contentInput" placeholder="오늘을 적어보세요."></textarea>
        </div>

        <aside class="music">
          <div class="turntable" aria-label="LP 플레이어">
            <div class="record" id="record">
              <div class="record-photo" id="recordPhoto"></div>
              <div class="record-hole"></div>
            </div>
            <div class="arm" id="arm"></div>
          </div>

          <input id="youtubeInput" type="url" placeholder="YouTube link" aria-label="유튜브 링크">

          <div class="controls">
            <button id="playBtn" type="button" disabled>play</button>
            <button id="stopBtn" type="button" disabled>stop</button>
          </div>
          <div id="youtubePlayer" class="hidden-player"></div>
        </aside>
      </section>

      <footer class="bottom-bar">
        <button id="deleteBtn" class="text-btn subtle" type="button">delete</button>
        <button id="saveBtn" class="text-btn" type="button">save</button>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
